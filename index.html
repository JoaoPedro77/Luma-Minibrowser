<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Luma</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="src/style.css">

</head>

<body>
    <div id="app">
        <div id="toolbar">
            <div id="controls">
                <button id="back" @click="goBack"><i class="ph ph-arrow-left"></i></button>
                <button id="forward" @click="goForward"><i class="ph ph-arrow-right"></i></button>
                <button id="reload" @click="reload"><i class="ph ph-arrow-clockwise"></i></button>
                <input id="port" type="text" v-model="port" @keydown.enter="navigateToPort">
                <button id="go" @click="navigateToPort"><i class="ph ph-caret-right"></i></button>

            </div>
            <div id="window-controls">
                <button id="pin" :class="{ active: isPinned }" @click="toggleAlwaysOnTop"><i
                        class="ph ph-push-pin"></i></button>
                <button id="maximize" @click="toggleMaximize"><i class="ph ph-square"></i></button>
                <button id="close" @click="closeApp"><i class="ph ph-x"></i></button>
            </div>
        </div>

        <div id="content">
            <webview id="viewer" ref="webviewRef" src="about:blank" allowpopups></webview>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script src="renderer.js"></script>
</body>

</html>
